; ============================================================
;  Placa de Preço Inteligente - ESP32 CYD (2.8" TFT + Touch)
; ============================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ ^8.3.11
    h2zero/NimBLE-Arduino @ ^1.4.1
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    ; --- TFT_eSPI: usa o User_Setup.h deste projeto em vez do padrão da lib ---
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h

    ; --- LVGL: usa include/lv_conf.h deste projeto ---
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

    -DCORE_DEBUG_LEVEL=1

board_build.partitions = default.csv
board_build.filesystem = littlefs

; Descomente para gravar os áudios (pasta data/) no LittleFS junto com o firmware:
; extra_scripts = pre:tools/uploadfs.py
