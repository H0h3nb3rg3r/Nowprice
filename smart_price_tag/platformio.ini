[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
    bodmer/TFT_eSPI@^2.5.0
    lvgl/lvgl@^8.3.11
    espressif/ESP32-BLE-Mesh@^1.0.0

build_flags = 
    -DUSER_SETUP_LOADED=1
    -DCORE_DEBUG_LEVEL=0
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320